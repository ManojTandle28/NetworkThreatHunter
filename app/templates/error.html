{% extends "base.html" %}

{% block title %}Error {{ error_code }} — NetworkThreatHunter{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 3rem auto; text-align: center; padding: 2.5rem 1.5rem;">
  <div style="font-size: 2.5rem; margin-bottom: 0.75rem; color: #f87171;">⚠️</div>
  <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-main);">
    {{ error_code }} &bull; {{ title }}
  </h2>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.6;">
    {{ message }}
  </p>

  <div style="display: flex; justify-content: center; gap: 0.75rem;">
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">
      &larr; Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
